# gates.yaml — Quality gate definitions and lifecycle transition requirements
# This file lives at .context-index/governance/gates.yaml
# Generated by /adev:init. Edit as needed.
#
# Gate schema:
#   id:        (required) Unique identifier for the gate
#   name:      Display name
#   kind:      deterministic | probabilistic (default: deterministic)
#   tier:      fast | integration | e2e (default: fast)
#   command:   (required for deterministic gates) An argv LIST, never a shell string.
#   scope:     project | charter (default: project)
#   required:  true | false (default: true). When false, severity is forced to warning.
#   severity:  error | warning. Defaults: error for fast/integration, warning for e2e.
#   triggers:  List of lifecycle events (e.g., post-task, post-implement, pre-merge)

gates:
  - id: test
    name: Test Suite
    kind: deterministic
    tier: fast
    command: [python3, -m, pytest, -q]
    scope: project
    required: true
    severity: error
    triggers:
      - post-task
      - post-implement

  - id: test-js
    name: JS Unit Tests
    kind: deterministic
    tier: fast
    command: [node, --test, "tests_js/**/*.test.js"]
    scope: project
    required: true
    severity: error
    triggers:
      - post-task
      - post-implement

  - id: lint
    name: Linter
    kind: deterministic
    tier: fast
    command: [ruff, check, .]
    scope: project
    required: true
    severity: error
    triggers:
      - post-task

  - id: integration-test
    name: Integration Tests
    kind: deterministic
    tier: integration
    command: ""                 # unwired — no integration-test suite yet; seed once one exists
    scope: project
    required: true
    severity: error
    triggers:
      - post-implement

  - id: e2e-smoke
    name: E2E API Smoke Suite
    kind: deterministic
    tier: e2e
    command: [python3, -m, pytest, -q, tests_e2e/]
    scope: project
    required: false
    severity: warning
    triggers:
      - post-implement

# Lifecycle transition requirements — left empty until this repo has real code,
# per the unwired-sentinel guidance in the template this was scaffolded from.
transitions: {}

