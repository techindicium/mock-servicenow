<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeskNow Incident Console</title>
  <link rel="stylesheet" href="/static/css/console.css" />
  <link rel="stylesheet" href="/static/css/nav.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <script src="/static/js/incident-logic.js"></script>
  <script src="/static/js/incident.js" defer></script>
</head>
<body>
  <!-- "DeskNow" is a fictional parody brand for this training mock — a ServiceNow-shaped ITSM
       API/UI, not affiliated with or endorsed by ServiceNow, Inc. Its wordmark and mark echo the
       same visual idea (lowercase two-tone wordmark, a small icon cut into one letter) without
       tracing ServiceNow's actual logo file or exact brand colors. -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <circle cx="16" cy="16" r="16" class="brand-mark-bg" />
        <path d="M9 17l4 4 10-10" class="brand-mark-check" />
      </svg>
      <span class="brand-word"><span class="brand-desk">desk</span><span class="brand-now">now</span></span>
    </div>
  </header>
  <div class="app-shell">
    <nav class="nav-rail" id="nav-rail" aria-label="Main navigation">
      <button type="button" class="nav-item active" id="nav-incidents" data-view="incidents">Incidents</button>
      <button type="button" class="nav-item" id="nav-escalations" data-view="escalations">Escalations</button>
      <button type="button" class="nav-item" id="nav-directory" data-view="directory">Directory</button>
      <button type="button" class="nav-item" id="nav-dashboard" data-view="dashboard">Dashboard</button>
    </nav>

    <div class="app-main">
      <section id="view-incidents" class="view">
        <h1>Incidents</h1>
        <div id="incidents-error" role="alert" hidden></div>

        <section id="incident-list-view">
          <form id="incident-filter-form">
            <label>State
              <select id="filter-state" name="state"><option value="">All</option></select>
            </label>
            <label>Category <input id="filter-category" name="category" /></label>
            <label>Account <input id="filter-account_id" name="account_id" /></label>
            <label>Escalated
              <select id="filter-escalated" name="escalated">
                <option value="">All</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </label>
            <button type="submit">Apply filters</button>
          </form>

          <button id="open-create-incident" type="button">New Incident</button>

          <table id="incidents-table">
            <thead>
              <tr>
                <th>Number</th><th>Short description</th><th>State</th><th>Priority</th>
                <th>Category</th><th>Account</th><th>Escalated</th>
              </tr>
            </thead>
            <tbody id="incidents-table-body"></tbody>
          </table>

          <div id="incidents-pagination">
            <button id="incidents-prev-page" type="button">Previous</button>
            <span id="incidents-page-info"></span>
            <button id="incidents-next-page" type="button">Next</button>
          </div>
        </section>

        <section id="create-incident" hidden>
          <h2>New Incident</h2>
          <form id="create-incident-form">
            <label>Account ID <input id="create-account_id" name="account_id" required /></label>
            <label>Category <input id="create-category" name="category" required /></label>
            <label>Short description
              <input id="create-short_description" name="short_description" required />
            </label>
            <label>Description
              <textarea id="create-description" name="description" required></textarea>
            </label>
            <label>State <select id="create-state" name="state" required></select></label>
            <label>Priority <select id="create-priority" name="priority" required></select></label>
            <button type="submit">Create Incident</button>
            <button id="cancel-create-incident" type="button">Cancel</button>
            <p id="create-incident-error" role="alert" hidden></p>
          </form>
        </section>

        <section id="incident-record-view" hidden>
          <button id="back-to-list" type="button">Back to list</button>
          <h2 id="record-number"></h2>
          <dl id="record-fields"></dl>

          <form id="edit-incident-form">
            <label>State <select id="edit-state" name="state"></select></label>
            <label>Priority <select id="edit-priority" name="priority"></select></label>
            <label>Assigned to <input id="edit-assigned_to" name="assigned_to" /></label>
            <label>Assignment group <input id="edit-assignment_group" name="assignment_group" /></label>
            <button type="submit">Save changes</button>
            <p id="edit-incident-error" role="alert" hidden></p>
          </form>

          <section id="sla-panel">
            <h3>SLA</h3>
            <table id="sla-table">
              <thead>
                <tr>
                  <th>Definition</th><th>Target (min)</th><th>Actual (min)</th>
                  <th>Breached</th><th>Business hours only</th>
                </tr>
              </thead>
              <tbody id="sla-table-body"></tbody>
            </table>
          </section>

          <section id="work-notes-panel">
            <h3>Work notes</h3>
            <ol id="work-notes-timeline"></ol>

            <form id="add-work-note-form">
              <label>Created by <input id="note-created_by" name="created_by" required /></label>
              <label>Type <select id="note-note_type" name="note_type" required></select></label>
              <label>Body <textarea id="note-body" name="body" required></textarea></label>
              <button type="submit">Add work note</button>
              <p id="add-work-note-error" role="alert" hidden></p>
            </form>
          </section>

          <section id="related-escalation-panel">
            <h3>Related Escalation</h3>
            <div id="related-escalation-content"></div>
          </section>
        </section>
      </section>

      <section id="view-escalations" class="view" hidden>
        <h1>Escalations</h1>
        <div id="escalations-error" role="alert" hidden></div>
        <table id="escalations-table"><tbody></tbody></table>
        <form id="escalation-edit-form" hidden>
          <input type="hidden" name="number">
          <label>Summary <input type="text" name="summary"></label>
          <label>Owner <input type="text" name="owner"></label>
          <label>Closed at <input type="text" name="closed_at"></label>
          <button type="submit">Save</button>
        </form>
        <button type="button" id="open-create-escalation">New Escalation</button>
        <section id="create-escalation" hidden>
          <h2>New Escalation</h2>
          <form id="create-escalation-form">
            <label>Account ID <input id="create-escalation-account_id" name="account_id" required /></label>
            <label>Summary <input id="create-escalation-summary" name="summary" required /></label>
            <label>Incident number <input id="create-escalation-incident_number" name="incident_number" /></label>
            <label>Owner <input id="create-escalation-owner" name="owner" /></label>
            <button type="submit">Create Escalation</button>
            <button id="cancel-create-escalation" type="button">Cancel</button>
            <p id="create-escalation-error" role="alert" hidden></p>
          </form>
        </section>
      </section>
      <section id="view-directory" class="view" hidden>
        <h1>Directory</h1>
        <div id="directory-error" role="alert" hidden></div>
        <table id="users-table"><tbody></tbody></table>
        <table id="assignment-groups-table"><tbody></tbody></table>
      </section>
      <section id="view-dashboard" class="view" hidden>
        <h1>Dashboard</h1>
        <div id="dashboard-tiles"></div>
      </section>
    </div>
  </div>
  <script src="/static/js/ui-errors.js"></script>
  <script src="/static/js/nav-logic.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/escalations-logic.js"></script>
  <script src="/static/js/escalations.js"></script>
  <script src="/static/js/directory-logic.js"></script>
  <script src="/static/js/directory.js"></script>
  <script src="/static/js/dashboard-logic.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
