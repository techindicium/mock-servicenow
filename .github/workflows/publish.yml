name: Publish images

# Builds each of this repo's Dockerfiles and pushes them to GHCR, so a track repo can run
# this mock via `image:` in its own docker-compose.yml without cloning this repository.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: itsm-api
            dockerfile: docker/itsm-api/Dockerfile
          - service: mcp-server
            dockerfile: docker/mcp-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/techindicium/mock-servicenow/${{ matrix.service }}:latest
            ghcr.io/techindicium/mock-servicenow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
